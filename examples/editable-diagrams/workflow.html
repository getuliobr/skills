<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From visual concept to editable diagram</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; color: #182338; background: #eef1f5; font-family: Arial, sans-serif; }
main { max-width: 1500px; margin: auto; }
.preview { overflow: auto; padding: 20px; border: 1px solid #cbd5e1; border-radius: 12px; background-color: white; background-image: conic-gradient(#e8ebef 25%,transparent 0 50%,#e8ebef 0 75%,transparent 0); background-size: 20px 20px; }
.preview svg { display: block; width: 100%; min-width: 640px; height: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; align-items: center; }
button { font: 600 14px Arial,sans-serif; color: #182338; background: white; border: 1px solid #94a3b8; padding: 10px 16px; border-radius: 7px; cursor: pointer; }
button:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
button:disabled { opacity: .5; cursor: wait; }
p { font-size: 14px; line-height: 1.5; }
@media print { body { padding: 0; background: transparent; } .actions,p { display: none; } .preview { padding: 0; border: 0; background: none; overflow: visible; } .preview svg { min-width: 0; } }
</style>
</head>
<body><main>
<div class="preview" aria-label="Diagram preview"><svg xmlns="http://www.w3.org/2000/svg" id="diagram" width="1244" height="302" viewBox="0 0 1244 302" role="img" aria-labelledby="diagram-title diagram-description" font-family="Arial, Helvetica, sans-serif">
<title id="diagram-title">From visual concept to editable diagram</title>
<desc id="diagram-description">Editable horizontal process diagram. Named groups identify stages and connections.</desc>
<metadata id="diagram-decisions">[&quot;Transparent exterior; white card interiors.&quot;, &quot;Straight arrows with labels inside real gutters.&quot;, &quot;Keep stable element IDs during conversational edits.&quot;]</metadata>
<g id="visual-concept" data-label="Visual concept" transform="translate(32 32)">
<rect width="320" height="238" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<path d="M20 14 H300" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<text data-part="heading" x="22" y="48" fill="#2563eb" font-size="20" font-weight="700">Visual concept</text>
<circle cx="25" cy="85" r="2.5" fill="#2563eb"/>
<text data-part="body" x="38" y="90" fill="#40516a" font-size="16">Generate an image or</text>
<text data-part="body" x="38" y="113" fill="#40516a" font-size="16">use a reference</text>
<circle cx="25" cy="143" r="2.5" fill="#2563eb"/>
<text data-part="body" x="38" y="148" fill="#40516a" font-size="16">Confirm wording and</text>
<text data-part="body" x="38" y="171" fill="#40516a" font-size="16">connections</text>
</g>
<g id="editable-artwork" data-label="Editable artwork" transform="translate(462 32)">
<rect width="320" height="238" rx="14" fill="#ffffff" stroke="#13834b" stroke-width="1.5"/>
<path d="M20 14 H300" fill="none" stroke="#13834b" stroke-width="4" stroke-linecap="round"/>
<text data-part="heading" x="22" y="48" fill="#13834b" font-size="20" font-weight="700">Editable artwork</text>
<circle cx="25" cy="85" r="2.5" fill="#13834b"/>
<text data-part="body" x="38" y="90" fill="#40516a" font-size="16">Rebuild with named SVG</text>
<text data-part="body" x="38" y="113" fill="#40516a" font-size="16">elements</text>
<circle cx="25" cy="143" r="2.5" fill="#13834b"/>
<text data-part="body" x="38" y="148" fill="#40516a" font-size="16">Calculate spacing and</text>
<text data-part="body" x="38" y="171" fill="#40516a" font-size="16">arrow anchors</text>
</g>
<g id="inspect-and-refine" data-label="Inspect and refine" transform="translate(892 32)">
<rect width="320" height="238" rx="14" fill="#ffffff" stroke="#b56808" stroke-width="1.5"/>
<path d="M20 14 H300" fill="none" stroke="#b56808" stroke-width="4" stroke-linecap="round"/>
<text data-part="heading" x="22" y="48" fill="#b56808" font-size="20" font-weight="700">Inspect and refine</text>
<circle cx="25" cy="85" r="2.5" fill="#b56808"/>
<text data-part="body" x="38" y="90" fill="#40516a" font-size="16">Inspect the rendered</text>
<text data-part="body" x="38" y="113" fill="#40516a" font-size="16">result</text>
<circle cx="25" cy="143" r="2.5" fill="#b56808"/>
<text data-part="body" x="38" y="148" fill="#40516a" font-size="16">Refine through</text>
<text data-part="body" x="38" y="171" fill="#40516a" font-size="16">conversation</text>
<circle cx="25" cy="201" r="2.5" fill="#b56808"/>
<text data-part="body" x="38" y="206" fill="#40516a" font-size="16">Export for slides</text>
</g>
<g id="concept-to-artwork" data-label="Rebuild" data-from="visual-concept" data-to="editable-artwork" fill="#2563eb">
<path data-part="shaft" d="M360 151 H444" fill="none" stroke="#2563eb" stroke-width="3"/>
<path data-part="arrowhead" d="M454 151 l-12 -7 v14 Z"/>
<text data-part="label" x="407" y="181" text-anchor="middle" font-size="15" font-weight="700">Rebuild</text>
</g>
<g id="artwork-to-review" data-label="Review" data-from="editable-artwork" data-to="inspect-and-refine" fill="#13834b">
<path data-part="shaft" d="M790 151 H874" fill="none" stroke="#13834b" stroke-width="3"/>
<path data-part="arrowhead" d="M884 151 l-12 -7 v14 Z"/>
<text data-part="label" x="837" y="181" text-anchor="middle" font-size="15" font-weight="700">Review</text>
</g>
</svg></div>
<div class="actions"><button id="download-svg">Download SVG</button><button id="download-png">Download PNG · 4096px wide</button></div>
<p id="status" role="status" aria-live="polite">The checkerboard indicates transparency and is excluded from exports.</p>
</main>
<script>
const graphic = document.querySelector('.preview svg');
const status = document.getElementById('status');
function svgBlob() {
  return new Blob([new XMLSerializer().serializeToString(graphic)], {type: 'image/svg+xml;charset=utf-8'});
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
document.getElementById('download-svg').addEventListener('click', () => download(svgBlob(), 'diagram.svg'));
document.getElementById('download-png').addEventListener('click', async event => {
  const button = event.currentTarget;
  button.disabled = true; status.textContent = 'Preparing PNG…';
  const url = URL.createObjectURL(svgBlob());
  try {
    await document.fonts.ready;
    const img = new Image();
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
    const box = graphic.viewBox.baseVal;
    const canvas = document.createElement('canvas');
    canvas.width = 4096; canvas.height = Math.round(4096 * box.height / box.width);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('PNG encoding failed');
    download(blob, 'diagram.png'); status.textContent = 'PNG downloaded. The preview checkerboard is excluded.';
  } catch (error) {
    status.textContent = 'PNG export failed. Download the SVG instead. ' + error.message;
  } finally { URL.revokeObjectURL(url); button.disabled = false; }
});
</script>
</body>
</html>
